<div class="page-heading">
  <div>
    <span class="eyebrow">UREJANJE PODATKOV</span>
    <h1>Vnos podatkov<span class="heading-period">.</span></h1>
    <p class="muted">Dodaj pošiljke, relacije, parametre in praznike.</p>
  </div>
</div>
@if (error) {
  <div class="notice" role="alert">{{ error }}</div>
}
@if (message) {
  <div class="notice success" role="status">{{ message }}</div>
}
<div class="data-entry-grid">
  <section class="panel data-card">
    <h3>Nova pošiljka</h3>
    <form class="data-form" (ngSubmit)="save('shipment')">
      <label for="ship-route">Relacija</label
      ><select id="ship-route" name="shipRoute" [(ngModel)]="shipment.routeId" required>
        @for (route of routes; track route.id) {
          <option [ngValue]="route.id">{{ route.code }} · {{ route.from }} → {{ route.to }}</option>
        }</select
      ><label for="ship-load">Datum naklada</label
      ><input
        id="ship-load"
        name="load"
        type="date"
        [(ngModel)]="shipment.loadingDate"
        required
      /><label for="ship-delivery">Datum dostave</label
      ><input
        id="ship-delivery"
        name="delivery"
        type="date"
        [(ngModel)]="shipment.deliveryDate"
        required
      /><label for="ship-deadline">Rok prejemnika</label
      ><input
        id="ship-deadline"
        name="deadline"
        type="date"
        [(ngModel)]="shipment.recipientDeadline"
        required
      /><label for="ship-weight">Teža (kg)</label
      ><input
        id="ship-weight"
        name="weight"
        type="number"
        min="1"
        [(ngModel)]="shipment.weightKg"
        required
      /><label for="ship-unit">Enota</label
      ><input id="ship-unit" name="unit" [(ngModel)]="shipment.unitType" required /><label
        class="check-label"
        ><input type="checkbox" name="adr" [(ngModel)]="shipment.adr" /> ADR tovor</label
      ><button class="primary-btn" [disabled]="saving === 'shipment'">
        {{ saving === 'shipment' ? 'Shranjujem…' : 'Dodaj pošiljko' }}
      </button>
    </form>
  </section>
  <section class="panel data-card">
    <h3>Nova relacija</h3>
    <form class="data-form" (ngSubmit)="save('route')">
      <label for="route-code">Oznaka</label
      ><input id="route-code" name="code" maxlength="3" [(ngModel)]="route.code" required /><label
        for="route-direction"
        >Smer</label
      ><select id="route-direction" name="direction" [(ngModel)]="route.direction">
        <option>Izvoz</option>
        <option>Uvoz</option></select
      ><label for="route-lcountry">Država naklada</label
      ><input
        id="route-lcountry"
        name="lcountry"
        maxlength="2"
        [(ngModel)]="route.loadingCountry"
        required
      /><label for="route-lpostal">Poštna številka naklada</label
      ><input
        id="route-lpostal"
        name="lpostal"
        [(ngModel)]="route.loadingPostalCode"
        required
      /><label for="route-lcity">Kraj naklada</label
      ><input id="route-lcity" name="lcity" [(ngModel)]="route.loadingCity" required /><label
        for="route-ucountry"
        >Država razklada</label
      ><input
        id="route-ucountry"
        name="ucountry"
        maxlength="2"
        [(ngModel)]="route.unloadingCountry"
        required
      /><label for="route-upostal">Poštna številka razklada</label
      ><input
        id="route-upostal"
        name="upostal"
        [(ngModel)]="route.unloadingPostalCode"
        required
      /><label for="route-ucity">Kraj razklada</label
      ><input id="route-ucity" name="ucity" [(ngModel)]="route.unloadingCity" required /><label
        for="route-distance"
        >Razdalja (km)</label
      ><input
        id="route-distance"
        name="distance"
        type="number"
        min="1"
        [(ngModel)]="route.roadDistanceKm"
        required
      /><label for="route-unit">Tipična enota</label
      ><input id="route-unit" name="runit" [(ngModel)]="route.unitType" required /><label
        for="route-lstart"
        >Naklad od</label
      ><input
        id="route-lstart"
        name="lstart"
        type="time"
        [(ngModel)]="route.loadingWindowStart"
        required
      /><label for="route-lend">Naklad do</label
      ><input
        id="route-lend"
        name="lend"
        type="time"
        [(ngModel)]="route.loadingWindowEnd"
        required
      /><label for="route-ustart">Razklad od</label
      ><input
        id="route-ustart"
        name="ustart"
        type="time"
        [(ngModel)]="route.unloadingWindowStart"
        required
      /><label for="route-uend">Razklad do</label
      ><input
        id="route-uend"
        name="uend"
        type="time"
        [(ngModel)]="route.unloadingWindowEnd"
        required
      /><label for="route-note">Opomba</label
      ><textarea id="route-note" name="rnote" [(ngModel)]="route.note"></textarea
      ><button class="primary-btn" [disabled]="saving === 'route'">
        {{ saving === 'route' ? 'Shranjujem…' : 'Dodaj relacijo' }}
      </button>
    </form>
  </section>
  <section class="panel data-card">
    <h3>Nov parameter</h3>
    <p class="muted">{{ parameterCount }} obstoječih parametrov</p>
    <form class="data-form" (ngSubmit)="save('parameter')">
      <label for="pgroup">Skupina</label
      ><input id="pgroup" name="pgroup" [(ngModel)]="parameter.group" required /><label for="pname"
        >Parameter</label
      ><input id="pname" name="pname" [(ngModel)]="parameter.name" required /><label for="pvalue"
        >Vrednost</label
      ><input
        id="pvalue"
        name="pvalue"
        [(ngModel)]="parameter.value"
        placeholder="npr. 250 + 1,30"
        required
      /><label for="punit">Enota</label
      ><input id="punit" name="punit" [(ngModel)]="parameter.unit" /><label for="pnote"
        >Opomba</label
      ><textarea id="pnote" name="pnote" [(ngModel)]="parameter.note"></textarea
      ><button class="primary-btn" [disabled]="saving === 'parameter'">Dodaj parameter</button>
    </form>
  </section>
  <section class="panel data-card">
    <h3>Nov praznik</h3>
    <p class="muted">{{ holidayCount }} obstoječih praznikov</p>
    <form class="data-form" (ngSubmit)="save('holiday')">
      <label for="hcountry">Država (ISO)</label
      ><input
        id="hcountry"
        name="hcountry"
        maxlength="2"
        [(ngModel)]="holiday.countryCode"
        required
      /><label for="hdate">Datum</label
      ><input id="hdate" name="hdate" type="date" [(ngModel)]="holiday.date" required /><label
        for="hname"
        >Praznik</label
      ><input id="hname" name="hname" [(ngModel)]="holiday.name" required /><label for="hnote"
        >Opomba</label
      ><textarea id="hnote" name="hnote" [(ngModel)]="holiday.note"></textarea
      ><button class="primary-btn" [disabled]="saving === 'holiday'">Dodaj praznik</button>
    </form>
  </section>
</div>
